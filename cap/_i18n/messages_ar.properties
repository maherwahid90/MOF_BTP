NODE_NOT_FOUND=البند غير موجود.
PARENT_NOT_FOUND=البند الأب غير موجود.
PARENT_CYCLE=لا يمكن وضع البند تحت نفسه أو تحت أحد البنود التابعة له.
NODE_LOCKED_SUBMITTED=البند بانتظار الاعتماد ولا يمكن تعديله.
NODE_HAS_CHILDREN=احذف البنود التابعة أو انقلها أولاً.
INVALID_STATUS_SUBMIT=يمكن إرسال البنود الجديدة أو المرفوضة فقط للموافقة.
INVALID_STATUS_DECIDE=يمكن اعتماد أو رفض البنود المرسلة للموافقة فقط.
REJECTION_REASON_REQUIRED=أدخل سبب الرفض.
DUPLICATE_CODE=رمز البند {0} موجود مسبقاً.
END_BEFORE_START=يجب ألا يسبق تاريخ النهاية تاريخ البداية.
PERCENT_RANGE=يجب أن تكون النسبة بين 0 و 100.
NEGATIVE_AMOUNT=يجب ألا يكون المبلغ سالباً.
DISCOUNT_ABOVE_PRICE=يجب ألا تتجاوز قيمة الخصم سعر البند.
DUPLICATE_PAY_TYPE=طريقة الدفع {0} مكررة.
DUPLICATE_GOV_ENTITY=الجهة الحكومية {0} مكررة.
COLLECTION_PCT_TOTAL=مجموع نسب إيراد الجهات الوكيلة {0}% وهو أكثر من 100%.
CODE_IN_USE=الرمز {0} مستخدم ولا يمكن حذفه.
